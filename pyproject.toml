[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pve-osx"
version = "0.1.0"
authors = [{ name = "jose-pr" }]
description = "Remotely provision and diagnose macOS/Hackintosh VMs on Proxmox VE via its REST API (plus SSH for what the API can't do)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["proxmox", "pve", "macos", "hackintosh", "qemu", "opencore", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = ["duho>=0.3.2"]

[project.optional-dependencies]
api = ["proxmoxer", "requests"]
ssh = ["paramiko"]
all = ["proxmoxer", "requests", "paramiko"]
dev = ["build", "hatchling", "pytest", "pytest-timeout", "twine", "proxmoxer", "requests", "paramiko"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
pve-osx = "pve_osx.cli:run"

[project.urls]
Homepage = "https://github.com/jose-pr/pve-osx/"
Documentation = "https://jose-pr.github.io/pve-osx/"
Issues = "https://github.com/jose-pr/pve-osx/issues"

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "pve_osx/README.md"

[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/tools"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
timeout = 60
timeout_method = "thread"

[tool.pyright]
reportPrivateImportUsage = false
reportUnusedExpression = false
